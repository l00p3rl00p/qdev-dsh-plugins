name: DeepSeek Harness Plugin Packager
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Apply automatic source formatting
        run: pnpm run format
      - name: Apply ESLint safe fixes
        run: pnpm run lint:fix
      - name: ESLint (TypeScript)
        run: pnpm run lint
      - name: Prettier (TypeScript)
        run: pnpm run formatcheck
      - name: TypeScript language server available
        run: pnpm exec typescript-language-server --version
      - name: Typecheck
        run: pnpm run typecheck
      - name: Unit tests
        run: pnpm test
      - name: Build
        run: pnpm run build
      - name: Validate native DSH package contract
        run: pnpm run check:package
      # check:package rejects browser requires outside DSH's registered loader modules.
      - name: Package installable DSH plugin
        run: |
          mkdir -p dist
          pnpm pack --pack-destination dist
      - name: Read package version
        id: package
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Verify bundled plugin actually imports
        run: |
          node --input-type=module -e "import('./lib/index.js').then(m => { if (typeof m.apply !== 'function' || !m.Config) process.exit(1) })"
          node ./lib/cli.js list | grep -q 'python / autoCorrect / ruff-fix'
      - name: Verify package contents
        run: |
          test -f lib/index.js
          test -f lib/index.d.ts
          tar -tzf "dist/dsh-auto-code-correct-${{ steps.package.outputs.version }}.tgz" | grep -q 'package/lib/index.js'
          tar -tzf "dist/dsh-auto-code-correct-${{ steps.package.outputs.version }}.tgz" | grep -q 'package/cordis.patch.yml'
          tar -tzf "dist/dsh-auto-code-correct-${{ steps.package.outputs.version }}.tgz" | grep -q 'package/lib/cli.js'
          tar -tzf "dist/dsh-auto-code-correct-${{ steps.package.outputs.version }}.tgz" | grep -q 'package/lib/client.js'
      - name: Install package into clean official DSH profile
        env:
          DSH_HOME: ${{ runner.temp }}/acc-dsh-home
        run: |
          ARTIFACT="./dist/dsh-auto-code-correct-${{ steps.package.outputs.version }}.tgz"
          test -f "$ARTIFACT"
          pnpm dlx --package=@deepseek-ai/dsh@0.2.1-rc.5 dsh plugin --profile acc-ci add @deepseek-ai/dsh-lsp@0.2.1-rc.5 @deepseek-ai/dsh-lsp-stdio@0.2.1-rc.5 "$ARTIFACT"
          pnpm dlx --package=@deepseek-ai/dsh@0.2.1-rc.5 dsh --profile acc-ci --dump-config | grep -q auto-code-correct
      - name: Publish installable plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: dsh-auto-code-correct-plugin
          path: dist/dsh-auto-code-correct-${{ steps.package.outputs.version }}.tgz
          if-no-files-found: error
          retention-days: 90
