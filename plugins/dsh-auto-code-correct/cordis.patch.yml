- insert:
    - id: auto-code-correct
      name: dsh-auto-code-correct
      config:
        tools: [write, edit, str_replace_editor]
        languages:
          python: true
          rust: false
          typescript: false
        capabilities: {}
        hygieneEnabled: true
        # Each fixer/checker name is independently switchable under capabilities.
        # Example: capabilities: { ruff-fix: false, ty: true }
        maxDiagnosticChars: 4000
        fixers:
          - name: ruff-fix
            extensions: ['.py']
            argv: ['ruff', 'check', '--fix', '--no-cache', '{file}']
          - name: ruff-format
            extensions: ['.py']
            argv: ['ruff', 'format', '--no-cache', '{file}']
          - name: rustfmt
            extensions: ['.rs']
            argv: ['rustfmt', '--edition', '2021', '{file}']
          - name: clippy-fix
            extensions: ['.rs']
            argv: ['cargo', 'clippy', '--fix', '--allow-dirty', '--allow-staged', '--', '-D', 'warnings']
          - name: eslint-fix
            extensions: ['.ts', '.tsx']
            argv: ['eslint', '--fix', '{file}']
          - name: prettier
            extensions: ['.ts', '.tsx']
            argv: ['prettier', '--write', '{file}']
        checkers:
          - name: ruff-verify
            extensions: ['.py']
            argv: ['ruff', 'check', '--no-cache', '{file}']
          - name: ty
            extensions: ['.py']
            argv: ['ty', 'check', '{file}']
          - name: cargo-check
            extensions: ['.rs']
            argv: ['cargo', 'check']
          - name: clippy-verify
            extensions: ['.rs']
            argv: ['cargo', 'clippy', '--', '-D', 'warnings']
          - name: eslint-verify
            extensions: ['.ts', '.tsx']
            argv: ['eslint', '{file}']
          - name: typescript-check
            extensions: ['.ts', '.tsx']
            argv: ['tsc', '--noEmit']
          - name: shellcheck
            extensions: ['.sh']
            argv: ['shellcheck', '{file}']
